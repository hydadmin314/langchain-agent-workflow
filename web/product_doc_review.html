<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品文档抽取审核</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-soft: #f1f4f8;
      --line: #dce2ea;
      --text: #1d2733;
      --muted: #657386;
      --brand: #176b87;
      --brand-soft: #e5f3f6;
      --ok: #16784b;
      --warn: #9a6200;
      --bad: #a23a35;
      --ok-soft: #e5f6ed;
      --warn-soft: #fff4d8;
      --bad-soft: #fdebea;
      --shadow: 0 8px 22px rgba(24, 39, 54, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.3;
    }

    .meta-line {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .filters {
      padding: 12px;
      display: grid;
      gap: 8px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
    }

    .doc-list {
      padding: 8px;
      overflow: auto;
      display: grid;
      gap: 8px;
    }

    .doc-button {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      color: var(--text);
    }

    .doc-button:hover {
      border-color: #9db4c1;
      box-shadow: var(--shadow);
    }

    .doc-button.active {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .doc-title {
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .doc-sub {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .doc-counts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      line-height: 1.2;
      background: var(--panel-soft);
      color: var(--muted);
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .chip.ok { background: var(--ok-soft); color: var(--ok); }
    .chip.warn { background: var(--warn-soft); color: var(--warn); }
    .chip.bad { background: var(--bad-soft); color: var(--bad); }
    .chip.brand { background: var(--brand-soft); color: var(--brand); }

    .main {
      min-width: 0;
      padding: 18px 22px 28px;
      overflow: auto;
    }

    .toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .toolbar h2 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .action-button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      height: 34px;
      padding: 0 10px;
      cursor: pointer;
      color: var(--text);
    }

    .action-button.active {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 800;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .section-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fcfdff;
    }

    .section-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .section-body {
      padding: 14px;
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
    }

    .kv {
      border: 1px solid var(--line);
      background: #fbfcfe;
      border-radius: 6px;
      padding: 10px;
      min-width: 0;
    }

    .kv-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .kv-value {
      overflow-wrap: anywhere;
      line-height: 1.55;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      background: #fff;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      line-height: 1.55;
    }

    th {
      background: #f5f7fa;
      color: #405066;
      font-size: 12px;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .evidence {
      color: #37475c;
      max-width: 620px;
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--muted);
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    details {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      margin-bottom: 8px;
    }

    summary {
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    pre {
      margin: 0;
      padding: 12px;
      overflow: auto;
      background: #111820;
      color: #e8eef5;
      font-size: 12px;
      line-height: 1.6;
      max-height: 420px;
    }

    .loading, .error {
      max-width: 720px;
      margin: 80px auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .error {
      border-color: #e6b1ad;
      color: var(--bad);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 44vh;
      }

      .summary-grid, .kv-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      .main {
        padding: 14px;
      }

      .summary-grid, .kv-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="loading">正在读取抽取结果...</div>
  <script>
    const state = {
      data: null,
      docs: [],
      activeIndex: 0,
      query: "",
      view: "review"
    };

    const TOP_KEYS = [
      "document_info",
      "parties_and_application",
      "base_package",
      "optional_packages",
      "fee_and_term_rules",
      "agreement_rules",
      "supplemental_rules",
      "extraction_meta"
    ];

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function arr(value) {
      return Array.isArray(value) ? value : [];
    }

    function docCounts(doc) {
      return {
        packages: arr(doc.base_package?.packages).length,
        included: arr(doc.base_package?.included_items).length,
        optional: arr(doc.optional_packages).length,
        fees: arr(doc.fee_and_term_rules).length,
        agreements: arr(doc.agreement_rules).length,
        supplemental: arr(doc.supplemental_rules).length,
        warnings: arr(doc.extraction_meta?.schema_warnings).length + arr(doc.extraction_meta?.validation_issues).length
      };
    }

    function quality(doc) {
      const counts = docCounts(doc);
      if (counts.warnings > 0 || counts.packages === 0) return { label: "待复核", cls: "bad" };
      if (counts.optional === 0 && counts.fees === 0 && counts.supplemental === 0) return { label: "需抽检", cls: "warn" };
      return { label: "可审核", cls: "ok" };
    }

    function filteredDocs() {
      const q = state.query.trim().toLowerCase();
      if (!q) return state.docs.map((doc, index) => ({ doc, index }));
      return state.docs
        .map((doc, index) => ({ doc, index }))
        .filter(({ doc }) => {
          const info = doc.document_info || {};
          return [info.title, info.product_name, info.issuer, info.filename, info.effective_from]
            .join(" ")
            .toLowerCase()
            .includes(q);
        });
    }

    function renderApp() {
      const app = document.getElementById("app");
      app.className = "app";
      const activeDoc = state.docs[state.activeIndex] || state.docs[0];
      app.innerHTML = `
        <aside class="sidebar">
          ${renderSidebar()}
        </aside>
        <main class="main">
          ${activeDoc ? renderDocument(activeDoc) : '<div class="empty">没有可展示的文档。</div>'}
        </main>
      `;
      bindEvents();
    }

    function renderSidebar() {
      const data = state.data || {};
      const docs = filteredDocs();
      return `
        <div class="brand">
          <h1>产品文档抽取审核</h1>
          <div class="meta-line">生成时间：${esc(data.generated_at || "-")}</div>
          <div class="meta-line">来源：${esc(data.source_file || "-")}</div>
          <div class="meta-line">文档数：${esc(data.document_count ?? state.docs.length)}</div>
        </div>
        <div class="filters">
          <input class="search" id="search" value="${esc(state.query)}" placeholder="搜索产品、服务商、文件名">
        </div>
        <div class="doc-list">
          ${docs.map(({ doc, index }) => renderDocButton(doc, index)).join("") || '<div class="empty">没有匹配结果。</div>'}
        </div>
      `;
    }

    function renderDocButton(doc, index) {
      const info = doc.document_info || {};
      const counts = docCounts(doc);
      const q = quality(doc);
      return `
        <button class="doc-button ${index === state.activeIndex ? "active" : ""}" data-doc-index="${index}">
          <div class="doc-title">${esc(info.product_name || info.title || `文档 ${index + 1}`)}</div>
          <div class="doc-sub">${esc(info.issuer || "-")}</div>
          <div class="doc-sub">${esc(info.filename || "-")}</div>
          <div class="doc-counts">
            <span class="chip ${q.cls}">${q.label}</span>
            <span class="chip brand">套餐 ${counts.packages}</span>
            <span class="chip">可选 ${counts.optional}</span>
            <span class="chip">规则 ${counts.fees + counts.agreements}</span>
          </div>
        </button>
      `;
    }

    function renderDocument(doc) {
      const info = doc.document_info || {};
      const counts = docCounts(doc);
      const q = quality(doc);
      return `
        <div class="toolbar">
          <div>
            <h2>${esc(info.product_name || info.title || "未命名文档")}</h2>
            <div class="meta-line">${esc(info.filename || "")}</div>
          </div>
          <div class="actions">
            <button class="action-button ${state.view === "review" ? "active" : ""}" data-view="review">审核视图</button>
            <button class="action-button ${state.view === "json" ? "active" : ""}" data-view="json">JSON</button>
          </div>
        </div>

        <div class="summary-grid">
          ${metric("质量状态", `<span class="chip ${q.cls}">${q.label}</span>`)}
          ${metric("基础套餐", counts.packages)}
          ${metric("可选/权益", counts.optional)}
          ${metric("费用规则", counts.fees)}
          ${metric("协议/补充", counts.agreements + counts.supplemental)}
        </div>

        ${state.view === "json" ? renderJson(doc) : renderReview(doc)}
      `;
    }

    function metric(label, value) {
      return `
        <div class="metric">
          <div class="metric-label">${esc(label)}</div>
          <div class="metric-value">${value}</div>
        </div>
      `;
    }

    function renderReview(doc) {
      return `
        ${renderInfo(doc)}
        ${renderPackages(doc)}
        ${renderOptional(doc)}
        ${renderFees(doc)}
        ${renderAgreements(doc)}
        ${renderSupplemental(doc)}
        ${renderExtractionMeta(doc)}
      `;
    }

    function renderInfo(doc) {
      const info = doc.document_info || {};
      const app = doc.parties_and_application || {};
      const fields = app.application_fields || {};
      return section("文档基本信息", `
        <div class="kv-grid">
          ${kv("标题", info.title)}
          ${kv("产品名称", info.product_name)}
          ${kv("服务商", info.issuer || app.service_provider?.name)}
          ${kv("版本", info.version || "-")}
          ${kv("生效日期", info.effective_from || "-")}
          ${kv("文档类型", info.document_type || "-")}
          ${kv("必填字段", arr(fields.required).length)}
          ${kv("选填字段", arr(fields.optional).length)}
        </div>
        <details style="margin-top: 12px;">
          <summary>摘要与申请字段</summary>
          <div class="section-body">
            <p>${esc(info.summary || "-")}</p>
            ${renderApplicationFields("必填字段", arr(fields.required))}
            ${renderApplicationFields("选填字段", arr(fields.optional))}
          </div>
        </details>
      `);
    }

    function renderApplicationFields(title, fields) {
      if (!fields.length) return `<div class="meta-line">${esc(title)}：无</div>`;
      return `
        <div style="margin: 12px 0 8px; font-weight: 700;">${esc(title)}</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>字段</th>
                <th>候选项</th>
                <th>值</th>
                <th>证据</th>
              </tr>
            </thead>
            <tbody>
              ${fields.map(field => `
                <tr>
                  <td>${esc(field.label || field.name || field)}</td>
                  <td>${arr(field.options).length ? arr(field.options).map(option => `<span class="chip">${esc(option)}</span>`).join(" ") : "-"}</td>
                  <td>${esc(field.value || "-")}</td>
                  <td><div class="evidence">${esc(field.source_evidence || "-")}</div></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function kv(label, value) {
      return `
        <div class="kv">
          <div class="kv-label">${esc(label)}</div>
          <div class="kv-value">${esc(value ?? "-")}</div>
        </div>
      `;
    }

    function section(title, body, count = null) {
      return `
        <section class="section">
          <div class="section-header">
            <h3>${esc(title)}</h3>
            ${count === null ? "" : `<span class="chip brand">${count}</span>`}
          </div>
          <div class="section-body">${body}</div>
        </section>
      `;
    }

    function renderPackages(doc) {
      const items = arr(doc.base_package?.packages);
      const included = arr(doc.base_package?.included_items);
      const sla = doc.base_package?.sla || {};
      return section("基础套餐信息", `
        ${items.length ? table(
          ["套餐名称", "速率", "价格", "周期", "状态", "证据"],
          items.map(item => [
            item.package_name || "-",
            item.speed || "-",
            item.price === null || item.price === undefined ? "待填写" : `${item.price} ${item.currency || "CNY"}`,
            item.billing_period || "-",
            item.price_status || "-",
            item.source_evidence || "-"
          ])
        ) : '<div class="empty">没有抽取到基础套餐。</div>'}
        ${renderServiceAttributes(doc)}
        ${included.length ? renderDetailsList("套餐内包含内容", included, item => `${esc(item.name || item.category || "-")}：${esc(item.description || "")}`) : ""}
        ${(sla.eligibility || arr(sla.plans).length || arr(sla.compensation_rules).length) ? renderDetailsList("SLA", [sla], item => `<pre>${esc(JSON.stringify(item, null, 2))}</pre>`) : ""}
      `, items.length);
    }

    function renderServiceAttributes(doc) {
      const items = arr(doc.base_package?.service_attributes);
      if (!items.length) return "";
      return `
        <div style="margin-top: 12px;">
          ${table(
            ["属性类型", "名称", "值/说明", "候选项", "证据"],
            items.map(item => [
              item.attribute_type || "-",
              item.name || item.category || "-",
              item.value || "-",
              arr(item.options).length ? arr(item.options).join("、") : "-",
              item.source_evidence || "-"
            ])
          )}
        </div>
      `;
    }

    function renderOptional(doc) {
      const items = arr(doc.optional_packages);
      return section("增值免费可选包 / 权益包 / 增值收费可选包", `
        ${items.length ? table(
          ["类型", "名称", "费用摘要", "说明", "证据"],
          items.map(item => [
            item.package_type || "-",
            item.name || "-",
            item.fee_summary || "-",
            item.description || "-",
            item.source_evidence || "-"
          ])
        ) : '<div class="empty">没有抽取到可选包或权益包。</div>'}
      `, items.length);
    }

    function renderFees(doc) {
      const items = arr(doc.fee_and_term_rules);
      return section("费用与期限规则", `
        ${items.length ? table(
          ["类型", "名称", "说明", "证据"],
          items.map(item => [
            item.rule_type || "-",
            item.name || item.title || "-",
            item.description || "-",
            item.source_evidence || "-"
          ])
        ) : '<div class="empty">没有抽取到费用与期限规则。</div>'}
      `, items.length);
    }

    function renderAgreements(doc) {
      const items = arr(doc.agreement_rules);
      return section("协议条款 / 限制 / 违约 / 售后规则", `
        ${items.length ? table(
          ["类型", "标题", "说明", "证据"],
          items.map(item => [
            item.rule_type || "-",
            item.title || item.name || "-",
            item.description || "-",
            item.source_evidence || "-"
          ])
        ) : '<div class="empty">没有抽取到协议条款。</div>'}
      `, items.length);
    }

    function renderSupplemental(doc) {
      const items = arr(doc.supplemental_rules);
      return section("来自其它文件的补充规则", `
        ${items.length ? renderDetailsList("补充规则", items, item => `<pre>${esc(JSON.stringify(item, null, 2))}</pre>`) : '<div class="empty">没有抽取到补充规则。</div>'}
      `, items.length);
    }

    function renderExtractionMeta(doc) {
      const meta = doc.extraction_meta || {};
      return section("抽取元信息", `
        <div class="kv-grid">
          ${kv("Schema", meta.schema_version)}
          ${kv("生成时间", meta.generated_at)}
          ${kv("方法", meta.method)}
          ${kv("原始文档ID", meta.raw_document_id)}
        </div>
        ${arr(meta.schema_warnings).length ? renderDetailsList("Schema Warnings", meta.schema_warnings, item => esc(item)) : ""}
        ${meta.local_rule_quality ? `<details style="margin-top:12px;"><summary>本地规则质量信息</summary><pre>${esc(JSON.stringify(meta.local_rule_quality, null, 2))}</pre></details>` : ""}
      `);
    }

    function table(headers, rows) {
      return `
        <div class="table-wrap">
          <table>
            <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
            <tbody>
              ${rows.map(row => `<tr>${row.map(cell => `<td><div class="evidence">${esc(cell)}</div></td>`).join("")}</tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderDetailsList(title, items, renderer) {
      return `
        <details style="margin-top: 12px;">
          <summary>${esc(title)} (${items.length})</summary>
          <div class="section-body">
            ${items.map((item, index) => `
              <details ${index === 0 ? "open" : ""}>
                <summary>${esc(item.name || item.title || item.source_type || `条目 ${index + 1}`)}</summary>
                <div class="section-body">${renderer(item, index)}</div>
              </details>
            `).join("")}
          </div>
        </details>
      `;
    }

    function renderJson(doc) {
      return section("当前文档 JSON", `<pre>${esc(JSON.stringify(doc, null, 2))}</pre>`);
    }

    function bindEvents() {
      document.querySelectorAll("[data-doc-index]").forEach(button => {
        button.addEventListener("click", () => {
          state.activeIndex = Number(button.dataset.docIndex);
          renderApp();
        });
      });
      document.querySelectorAll("[data-view]").forEach(button => {
        button.addEventListener("click", () => {
          state.view = button.dataset.view;
          renderApp();
        });
      });
      const search = document.getElementById("search");
      if (search) {
        search.addEventListener("input", event => {
          state.query = event.target.value;
          renderApp();
        });
        search.focus({ preventScroll: true });
        search.setSelectionRange(search.value.length, search.value.length);
      }
    }

    async function init() {
      try {
        const response = await fetch("/api/schema", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.data = await response.json();
        state.docs = arr(state.data.documents);
        renderApp();
      } catch (error) {
        const app = document.getElementById("app");
        app.className = "error";
        app.innerHTML = `<strong>读取失败</strong><p>${esc(error.message)}</p>`;
      }
    }

    init();
  </script>
</body>
</html>
